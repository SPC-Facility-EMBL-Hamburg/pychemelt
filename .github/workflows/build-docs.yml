name: Build Documentation

# This workflow builds the Sphinx documentation in GitHub CI and uploads the
# generated HTML as a short-lived artifact.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'build_docs.py'
      - '.github/workflows/build-docs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'build_docs.py'
      - '.github/workflows/build-docs.yml'
      - 'pyproject.toml'
      - 'uv.lock'

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python 3.13
      run: uv python install 3.13

    - name: Cache uv packages
      uses: actions/cache@v4
      with:
        path: ${{ env.UV_CACHE_DIR }}
        key: ${{ runner.os }}-uv-3.13-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-3.13-
          ${{ runner.os }}-uv-

    - name: Build documentation
      run: |
        uv sync --extra docs
        uv run build_docs.py

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/_build/html/
        retention-days: 7
        if-no-files-found: error # Fail the workflow if no files are found
        overwrite: true
